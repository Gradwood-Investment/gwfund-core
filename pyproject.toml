[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwfund-core"
version = "0.2.0"
description = "渐木公募基金研究系统 · 核心算法库（三条恒等式 / TWR·MWR / 费用计提 / 规模归因 / 混频 / 追高资金）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gradwood Studio" }]
keywords = ["fund", "mutual-fund", "TWR", "MWR", "attribution", "china"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
# 运行时零依赖：只用标准库（decimal / math / dataclasses）。
# 这是 SOW §7.3 C10「core 纯函数化 + 架构测试禁 I/O」的直接保证。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/gradwood/gwfund-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "golden: 黄金向量（手算样例逐位复现，V3/V4 判据）",
    "trap: 附件A §9 陷阱 T1-T14 对应单测",
    "architecture: 架构测试（core 无 I/O）",
]

[tool.coverage.run]
source = ["gwfund_core"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
